name: Instagram GOV.UK Rehber

on:
  schedule:
    # Hedef: her gün Londra saatiyle 12:30 (GOV.UK rehber postu).
    # GitHub saatleri UTC'dir; yaz/kış saati için iki tetikleme var. Asıl tetikleyici cron-job.org.
    # Bu yüzden iki kez tetiklenir; bot Londra saatine bakar, erken olanı atlar,
    # aynı gün ikinci kez paylaşmaz. GitHub işleri 5-30 dakika gecikmeyle başlatabilir.
    - cron: "40 11 * * *"
    - cron: "40 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Deneme: görselleri üret ama Instagram'a gönderme"
        type: boolean
        default: true
      force:
        description: "Saat kontrolünü atla (elle çalıştırırken açık kalsın)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Font ve kütüphaneleri kur
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
          pip install -q -r requirements.txt

      - name: GOV.UK rehberini hazırla (Claude + görseller)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '0' }}
        run: python bot.py guide

      - name: Görselleri depoya yükle
        id: push
        run: |
          git config user.name "instagram-bot"
          git config user.email "instagram-bot@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "Yeni dosya yok."
          else
            git commit -q -m "Rehber görselleri $(date -u +%F)"
            for i in 1 2 3; do if git pull --rebase -X theirs -q origin "${GITHUB_REF_NAME}" && git push -q; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 5; done; [ "$ok" = 1 ] || exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Instagram'a yayınla
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          EXPECTED_IG_USERNAME: ${{ vars.EXPECTED_IG_USERNAME }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.push.outputs.sha }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
          FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '0' }}
        run: python bot.py guide-publish

      - name: Yayın kaydını sakla (aynı gün iki kez paylaşmasın)
        if: always()
        run: |
          git add output
          if ! git diff --cached --quiet; then
            git commit -q -m "Rehber yayın kaydı $(date -u +%F)"
            for i in 1 2 3; do if git pull --rebase -X theirs -q origin "${GITHUB_REF_NAME}" && git push -q; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 5; done; [ "$ok" = 1 ] || exit 1
          fi
