name: Instagram Hesap Kontrolü

# Elle çalıştırılır. Token'ın hangi Facebook Sayfasına ve hangi Instagram hesabına
# eriştiğini, ve IG_USER_ID değerini Actions kaydına yazar. Hiçbir şey paylaşmaz.
on:
  workflow_dispatch:

jobs:
  whoami:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Bağlı hesapları listele
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python bot.py whoami
      - name: İngilizce hesap için ayrı token varsa onu da kontrol et
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
        run: |
          if [ -n "$IG_ACCESS_TOKEN" ]; then python bot.py whoami; else echo "IG_ACCESS_TOKEN_EN yok; iki hesap da aynı token'ı kullanıyor."; fi
